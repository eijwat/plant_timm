<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 植物占い - BOTANICAL FORTUNE 🌈</title>
<style>
  * { box-sizing: border-box; }
  :root{
    --pink:#ff4fd8;
    --yellow:#fff33b;
    --green:#5cff7a;
    --cyan:#53e8ff;
    --purple:#8c4dff;
    --orange:#ff7b32;
    --ink:#162016;
  }

  body{
    margin:0;
    min-height:100vh;
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    color:#fff;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 10% 20%, rgba(255,79,216,.95), transparent 28%),
      radial-gradient(circle at 85% 15%, rgba(83,232,255,.9), transparent 30%),
      radial-gradient(circle at 75% 80%, rgba(92,255,122,.85), transparent 30%),
      radial-gradient(circle at 20% 85%, rgba(255,243,59,.8), transparent 30%),
      linear-gradient(135deg,#34176b,#111f52 45%,#0d513b);
    background-attachment: fixed;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.2;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 18px, rgba(255,255,255,.2) 19px 21px);
  }

  .leaf{
    position:fixed;
    font-size:clamp(25px,4vw,55px);
    animation: float 9s ease-in-out infinite;
    filter: drop-shadow(0 8px 5px rgba(0,0,0,.25));
    z-index:0;
    opacity:.8;
  }
  .leaf:nth-child(1){left:4%;top:7%;animation-delay:-1s}
  .leaf:nth-child(2){right:6%;top:16%;animation-delay:-3s}
  .leaf:nth-child(3){left:8%;bottom:10%;animation-delay:-5s}
  .leaf:nth-child(4){right:10%;bottom:8%;animation-delay:-7s}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-8deg)}
    50%{transform:translateY(-28px) rotate(12deg)}
  }

  .wrap{
    position:relative;
    z-index:1;
    width:min(920px,92vw);
    margin:0 auto;
    padding:42px 0 80px;
  }

  .hero{
    text-align:center;
    margin-bottom:24px;
  }

  .kicker{
    display:inline-block;
    padding:8px 16px;
    border:3px solid #fff;
    border-radius:999px;
    background:rgba(0,0,0,.22);
    box-shadow:6px 6px 0 #111;
    font-weight:900;
    letter-spacing:.12em;
  }

  h1{
    margin:14px 0 4px;
    font-size:clamp(44px,9vw,92px);
    line-height:.95;
    font-weight:1000;
    letter-spacing:-.06em;
    text-shadow:
      4px 4px 0 #101010,
      7px 7px 0 var(--pink),
      -4px -4px 0 var(--cyan);
  }

  .sub{
    font-weight:900;
    font-size:clamp(16px,3vw,24px);
    text-shadow:2px 2px 0 #111;
  }

  .panel{
    background:rgba(255,255,255,.93);
    color:var(--ink);
    border:5px solid #fff;
    border-radius:34px;
    padding:28px;
    box-shadow:15px 15px 0 rgba(0,0,0,.38);
    backdrop-filter: blur(10px);
  }

  .input-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  input{
    flex:1 1 300px;
    min-width:0;
    font:inherit;
    font-size:22px;
    font-weight:800;
    padding:17px 20px;
    border:4px solid #111;
    border-radius:18px;
    outline:none;
    background:#fffef0;
    box-shadow:6px 6px 0 var(--yellow);
  }
  input:focus{
    transform:translate(-2px,-2px);
    box-shadow:9px 9px 0 var(--cyan);
  }

  button{
    cursor:pointer;
    border:4px solid #111;
    border-radius:18px;
    padding:15px 24px;
    font:inherit;
    font-size:21px;
    font-weight:1000;
    color:#111;
    background:linear-gradient(135deg,var(--yellow),var(--pink));
    box-shadow:7px 7px 0 #111;
    transition:.12s ease;
  }
  button:hover{ transform:translate(-3px,-3px); box-shadow:10px 10px 0 #111; }
  button:active{ transform:translate(4px,4px); box-shadow:2px 2px 0 #111; }

  .hint{
    margin:16px 2px 0;
    font-size:14px;
    font-weight:700;
    opacity:.72;
  }

  .result{
    display:none;
    margin-top:28px;
    animation: pop .5s cubic-bezier(.2,1.7,.3,1);
  }
  @keyframes pop{
    0%{transform:scale(.72) rotate(-2deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}
  }

  .fortune-top{
    display:grid;
    grid-template-columns:160px 1fr;
    gap:22px;
    align-items:center;
  }

  .plant-icon{
    display:grid;
    place-items:center;
    width:150px;
    height:150px;
    border:5px solid #111;
    border-radius:32px 44px 28px 50px;
    background:linear-gradient(135deg,#fff,#eaffd8);
    font-size:82px;
    box-shadow:9px 9px 0 var(--green);
    transform:rotate(-3deg);
  }

  .fortune-label{
    display:inline-block;
    font-size:clamp(38px,8vw,72px);
    font-weight:1000;
    line-height:1;
    color:#fff;
    -webkit-text-stroke:3px #111;
    text-shadow:5px 5px 0 var(--pink), 9px 9px 0 var(--yellow);
  }

  .plant-name{
    margin-top:10px;
    font-size:clamp(24px,4vw,38px);
    font-weight:1000;
  }

  .message{
    margin:24px 0 0;
    padding:18px 20px;
    border:4px solid #111;
    border-radius:18px;
    background:linear-gradient(135deg,#dfffe5,#e0f4ff);
    font-size:18px;
    font-weight:800;
    line-height:1.8;
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:18px;
  }

  .card{
    min-height:135px;
    border:4px solid #111;
    border-radius:20px;
    padding:16px;
    background:#fff;
    box-shadow:6px 6px 0 #111;
  }

  .card:nth-child(1){background:#fff7b0}
  .card:nth-child(2){background:#ffd6f4}
  .card:nth-child(3){background:#c9f7ff}

  .card .title{
    font-size:13px;
    font-weight:1000;
    letter-spacing:.08em;
    opacity:.65;
  }
  .card .big{
    margin-top:8px;
    font-size:20px;
    font-weight:1000;
    line-height:1.4;
  }

  .meter{
    margin-top:22px;
    border:4px solid #111;
    background:#111;
    border-radius:999px;
    overflow:hidden;
  }
  .meter > div{
    height:22px;
    width:0;
    background:linear-gradient(90deg,var(--purple),var(--pink),var(--yellow),var(--green));
    transition:width .9s cubic-bezier(.2,.9,.2,1);
  }

  .footer{
    text-align:center;
    margin-top:24px;
    font-weight:900;
    opacity:.9;
  }

  .spark{
    position:fixed;
    pointer-events:none;
    z-index:999;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst{
    from{transform:translate(0,0) scale(.6) rotate(0);opacity:1}
    to{transform:translate(var(--x),var(--y)) scale(1.8) rotate(270deg);opacity:0}
  }

  @media(max-width:700px){
    .fortune-top{grid-template-columns:1fr;text-align:center}
    .plant-icon{margin:auto}
    .cards{grid-template-columns:1fr}
    .panel{padding:20px}
    button{width:100%}
  }
</style>
</head>
<body>

<div class="leaf">🌿</div>
<div class="leaf">🌺</div>
<div class="leaf">🍀</div>
<div class="leaf">🌻</div>

<main class="wrap">
  <div class="hero">
    <div class="kicker">BOTANICAL FORTUNE MACHINE</div>
    <h1>植物占い</h1>
    <div class="sub">あなたの名前を、今日の植物に変換します。</div>
  </div>

  <section class="panel">
    <div class="input-row">
      <input id="name" type="text" placeholder="名前を入力してください" maxlength="40" autocomplete="off">
      <button id="go">🌱 占う！</button>
    </div>
    <div class="hint">※ 植物タイプは名前から決定。運勢は押すたびランダムに変わります。植物学的な厳密さは、今日は休暇中です。</div>

    <div id="result" class="result">
      <div class="fortune-top">
        <div id="plantIcon" class="plant-icon">🌱</div>
        <div>
          <div id="fortune" class="fortune-label">大吉</div>
          <div id="plantName" class="plant-name">あなたは「ひまわり」タイプ</div>
        </div>
      </div>

      <div id="message" class="message"></div>

      <div class="cards">
        <div class="card">
          <div class="title">LUCKY COLOR</div>
          <div id="color" class="big"></div>
        </div>
        <div class="card">
          <div class="title">LUCKY ACTION</div>
          <div id="action" class="big"></div>
        </div>
        <div class="card">
          <div class="title">BOTANICAL ORACLE</div>
          <div id="oracle" class="big"></div>
        </div>
      </div>

      <div class="meter"><div id="meterBar"></div></div>
    </div>
  </section>

  <div class="footer">🌈 ROOT DEEP. GROW WILD. BLOOM LOUD. 🌈</div>
</main>

<script>
const plants = [
  {name:"ひまわり", icon:"🌻", trait:"堂々と太陽を向く、陽気な突破型"},
  {name:"サボテン", icon:"🌵", trait:"少ない条件でも生き抜く、超省エネの粘り強さ"},
  {name:"竹", icon:"🎋", trait:"しなっても折れにくい、成長スピード型"},
  {name:"桜", icon:"🌸", trait:"一瞬を華やかに変える、魅せる才能の持ち主"},
  {name:"苔", icon:"🟢", trait:"静かに広がり環境を変える、地味に最強型"},
  {name:"モンステラ", icon:"🪴", trait:"大胆な葉っぱで空間を支配する、存在感型"},
  {name:"朝顔", icon:"🌺", trait:"タイミングを逃さず咲く、朝の瞬発力型"},
  {name:"クローバー", icon:"🍀", trait:"小さな幸運を拾い集める、発見の名人"},
  {name:"バオバブ", icon:"🌳", trait:"時間を味方につける、スケール巨大型"},
  {name:"食虫植物", icon:"🪰", trait:"待つべき時は待ち、来たら逃さない戦略家"},
  {name:"蓮", icon:"🪷", trait:"泥の中からでもきれいに咲く、逆境変換型"},
  {name:"シダ", icon:"🌿", trait:"古代から続くしぶとさを持つ、歴史系サバイバー"}
];

const fortunes = [
  {name:"超大吉", score:[92,100]},
  {name:"大吉", score:[82,96]},
  {name:"中吉", score:[68,88]},
  {name:"小吉", score:[55,76]},
  {name:"吉", score:[48,70]},
  {name:"末吉", score:[38,62]},
  {name:"凶", score:[20,48]}
];

const colors = ["サンシャインイエロー","新芽グリーン","マゼンタピンク","空色シアン","藤色パープル","炎オレンジ","月光シルバー","深海ブルー"];
const actions = [
  "いつもと違う道を歩く",
  "植物を1枚だけ写真に撮る",
  "机の上を10cmだけ片づける",
  "気になっていた人に短い連絡をする",
  "新しいアイデアを1行だけメモする",
  "昼休みに外の光を見る",
  "迷ったら面白い方を選ぶ",
  "小さなことを一つ即決する"
];
const oracles = [
  "根が見えない日は、地下で伸びている。",
  "今日は枝を増やす日。結論を急がない。",
  "光の方向が変われば、伸びる方向も変えてよい。",
  "水のやりすぎ注意。親切も予定もほどほどに。",
  "花は会議をしてから咲かない。今日はまず一歩。",
  "思わぬ場所から新芽あり。",
  "古い葉を一枚落とすと、新しい余白ができる。",
  "風が強いほど、しなやかな茎が勝つ。"
];

function hashName(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function burst(){
  const symbols = ["🌸","🌿","✨","🍀","🌈","🌼","💥","🌱"];
  for(let i=0;i<28;i++){
    const e=document.createElement("div");
    e.className="spark";
    e.textContent=pick(symbols);
    e.style.left=(50+Math.random()*8-4)+"vw";
    e.style.top=(38+Math.random()*8-4)+"vh";
    e.style.fontSize=(18+Math.random()*28)+"px";
    e.style.setProperty("--x",(Math.random()*560-280)+"px");
    e.style.setProperty("--y",(Math.random()*500-250)+"px");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),950);
  }
}

function tellFortune(){
  const input=document.getElementById("name");
  const name=input.value.trim();
  if(!name){
    input.focus();
    input.placeholder="まず名前をどうぞ！ 🌱";
    return;
  }

  const plant = plants[hashName(name)%plants.length];
  const ft = pick(fortunes);
  const score = randomInt(ft.score[0], ft.score[1]);

  document.getElementById("result").style.display="block";
  document.getElementById("plantIcon").textContent=plant.icon;
  document.getElementById("fortune").textContent=ft.name;
  document.getElementById("plantName").textContent=`${name}さんは「${plant.name}」タイプ`;
  document.getElementById("message").innerHTML =
    `<strong>${plant.trait}。</strong><br>` +
    `今日の運勢は <strong>${ft.name}</strong>！ ` +
    (score>=80
      ? "伸びるなら今日です。遠慮なく葉を広げましょう。"
      : score>=60
      ? "焦らず、でも光の方向へ一歩。小さな成長が効きます。"
      : score>=45
      ? "今日は根を育てる日。見えない進歩も進歩です。"
      : "強風注意。でも植物は風を避けるだけでなく、風で強くもなります。");

  document.getElementById("color").textContent=pick(colors);
  document.getElementById("action").textContent=pick(actions);
  document.getElementById("oracle").textContent=pick(oracles);

  const bar=document.getElementById("meterBar");
  bar.style.width="0%";
  requestAnimationFrame(()=>setTimeout(()=>bar.style.width=score+"%",50));

  burst();
}

document.getElementById("go").addEventListener("click",tellFortune);
document.getElementById("name").addEventListener("keydown",e=>{
  if(e.key==="Enter") tellFortune();
});
</script>
</body>
</html>
